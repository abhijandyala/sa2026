# Render Blueprint: Field Shift backend API (free tier).
# Deploys from the `backend` branch and redeploys on every push to it.
# Free instances sleep after ~15 min idle; the first request then takes ~30-60 s.
# The frontend should show its bundled sample responses while the API wakes.
services:
  - type: web
    name: fieldshift-api
    runtime: python
    plan: free
    branch: backend
    autoDeploy: true
    # Editable install keeps fieldshift/ next to data/ (paths resolve from the repo root).
    buildCommand: pip install --upgrade pip && pip install -e .
    startCommand: uvicorn fieldshift.api.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Default origins (GitHub Pages + localhost:5173) are built in; set this to override.
      # - key: FIELDSHIFT_CORS_ORIGINS
      #   value: https://abhijandyala.github.io,http://localhost:5173
